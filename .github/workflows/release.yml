name: Main Release Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Security Validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest

    outputs:
      api_digest: ${{ steps.digests.outputs.api_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
      release_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate immutable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release version: sha-${GITHUB_SHA}"

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q app/api/app

          docker compose \
            --env-file app/.env.example \
            -f app/compose.yaml \
            config >/dev/null

          echo "Application validation passed."

      - name: Build API image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t p5-api:${{ steps.version.outputs.image_tag }} \
            app/api

      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t p5-frontend:${{ steps.version.outputs.image_tag }} \
            app/frontend

      - name: Full vulnerability reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vulnerability-reports
          for component in api frontend; do
            docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               -v "$PWD/vulnerability-reports:/reports"               aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969               image --scanners vuln --format json --exit-code 0               --output "/reports/$component.json"               "p5-$component:${{ steps.version.outputs.image_tag }}"
          done

      - name: Upload full vulnerability reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vulnerabilities-${{ steps.version.outputs.image_tag }}
          path: vulnerability-reports/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Security gate - API
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            p5-api:${{ steps.version.outputs.image_tag }}

      - name: Security gate - frontend
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            p5-frontend:${{ steps.version.outputs.image_tag }}

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sbom

          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/workspace"             aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969             image             --format cyclonedx             --output /workspace/sbom/api-sbom.cdx.json             p5-api:${{ steps.version.outputs.image_tag }}

          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD:/workspace"             aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969             image             --format cyclonedx             --output /workspace/sbom/frontend-sbom.cdx.json             p5-frontend:${{ steps.version.outputs.image_tag }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms-${{ steps.version.outputs.image_tag }}
          path: sbom/*.cdx.json
          retention-days: 30

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image to GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gitops-cicd-deployment-platform-api:${{ steps.version.outputs.image_tag }}"

          docker tag             p5-api:${{ steps.version.outputs.image_tag }}             "${IMAGE}"

          docker push "${IMAGE}"

      - name: Publish frontend image to GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gitops-cicd-deployment-platform-frontend:${{ steps.version.outputs.image_tag }}"

          docker tag             p5-frontend:${{ steps.version.outputs.image_tag }}             "${IMAGE}"

          docker push "${IMAGE}"

      - name: Resolve published image digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail

          API_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gitops-cicd-deployment-platform-api"
          FRONTEND_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER}/gitops-cicd-deployment-platform-frontend"
          TAG="${{ steps.version.outputs.image_tag }}"

          API_DIGEST=$(docker buildx imagetools inspect             "${API_NAME}:${TAG}"             --format '{{json .Manifest}}' | jq -r '.digest')

          FRONTEND_DIGEST=$(docker buildx imagetools inspect             "${FRONTEND_NAME}:${TAG}"             --format '{{json .Manifest}}' | jq -r '.digest')

          DIGEST_PATTERN='^sha256:[a-f0-9]{64}$'

          [[ "${API_DIGEST}" =~ ${DIGEST_PATTERN} ]] || {
            echo "ERROR: Invalid API image digest: ${API_DIGEST}"
            exit 1
          }

          [[ "${FRONTEND_DIGEST}" =~ ${DIGEST_PATTERN} ]] || {
            echo "ERROR: Invalid frontend image digest: ${FRONTEND_DIGEST}"
            exit 1
          }

          echo "api_name=${API_NAME}" >> "$GITHUB_OUTPUT"
          echo "api_digest=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "frontend_name=${FRONTEND_NAME}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${FRONTEND_DIGEST}" >> "$GITHUB_OUTPUT"

          echo "API digest: ${API_DIGEST}"
          echo "Frontend digest: ${FRONTEND_DIGEST}"

      - name: Attest API build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.digests.outputs.api_name }}
          subject-digest: ${{ steps.digests.outputs.api_digest }}
          push-to-registry: true

      - name: Attest frontend build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.digests.outputs.frontend_name }}
          subject-digest: ${{ steps.digests.outputs.frontend_digest }}
          push-to-registry: true

      - name: Release validation summary
        shell: bash
        run: |
          echo "Release validation successful."
          echo "Immutable version: ${{ steps.version.outputs.image_tag }}"


  propose-development:
    name: Propose Development Deployment
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/gitops-update.yml
    with:
      api_digest: ${{ needs.release.outputs.api_digest }}
      frontend_digest: ${{ needs.release.outputs.frontend_digest }}
      release_sha: ${{ needs.release.outputs.release_sha }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
